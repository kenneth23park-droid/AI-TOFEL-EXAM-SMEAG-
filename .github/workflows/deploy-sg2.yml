# main 에 studyground/sg2/ 변경이 푸시되면 프로덕션으로 자동 배포.
# Vercel↔GitHub 앱 연동 대신 토큰으로 배포하므로 저장소 소유자 승인이 필요 없다.
on:
  push:
    branches: [main]
    paths:
      - 'studyground/sg2/**'
      - '.github/workflows/deploy-sg2.yml'
  workflow_dispatch:

concurrency:
  group: deploy-sg2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_2dm8OcEEEVPKcelKEMlZTzAR
      VERCEL_PROJECT_ID: prj_KZVPBfpDQ7dLpvaSsPI2rA10WF3V
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 배포 앞의 문. pre-commit 훅과 같은 검사를 여기서 다시 돈다 —
      # 훅은 `git commit --no-verify` 로 넘길 수 있지만 이 자리는 넘길 수 없다.
      #
      # 세트 완결성: SET 12 는 음성·배역표·사진표까지 커밋됐는데 문항 팩이 없어서
      # 가져온 그 브라우저 밖에서는 존재하지 않는 세트였다. 흔적이 있으면 팩·미디어·
      # 등록이 전부 있어야 한다.
      # 겹침: 훅 주석이 "배포는 막힌다"고 적어 두고도 이 워크플로에는 그 검사가 없었다.
      # 원본 docx 빈 틀: 파서가 바뀌어 틀이 더는 가져와지지 않으면 선생님은 틀대로 채우고도
      # 문항이 사라진 세트를 받는다. 틀을 strict 모드로 지어 120문항이 나오는지 본다.
      - name: Gate — 세트 완결성 · 문항 겹침 · 원본 틀
        run: |
          node studyground/tests/test_set_complete.js
          node studyground/tools/dup_check.js --quiet
          node studyground/tests/test_set_template.mjs

      - name: Install Vercel CLI
        run: npm install -g vercel@54

      # 정적 사이트라 빌드 단계가 없다. 소스를 그대로 올리면 Vercel 이 그대로 서빙한다.
      # 업로드 대상에서 _screens/, REPORT.md 를 빼는 건 sg2/.vercelignore 가 처리.
      - name: Deploy to production
        working-directory: studyground/sg2
        run: |
          url=$(vercel deploy --prod --yes --token="$VERCEL_TOKEN")
          echo "Deployed: $url"
          echo "### Deployed :rocket: $url" >> "$GITHUB_STEP_SUMMARY"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
