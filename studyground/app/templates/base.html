<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ t('app.name') }}{% endblock %}</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/?lang={{ lang }}">
      <span class="brand-mark">S</span>
      <span class="brand-text">
        <b>{{ t('app.name') }}</b>
        <small>{{ t('app.tagline') }}</small>
      </span>
    </a>
    <div class="topbar-right">
      <span class="mode-badge {{ 'local' if settings.is_local else 'cloud' }}">
        {{ t('mode.local') if settings.is_local else t('mode.cloud') }}
      </span>
      <a class="lang-toggle" href="{{ request.url.include_query_params(lang=other_lang) }}">
        {{ t('lang.toggle') }}
      </a>
    </div>
  </header>

  <main class="page">
    {% block content %}{% endblock %}
  </main>

  <footer class="foot">
    StudyGround · APP_MODE={{ settings.app_mode }} · scoring={{ settings.scoring_mode }}
  </footer>

  <script src="/assets/js/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
