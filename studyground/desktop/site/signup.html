<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign Up · SMEAG MockTest</title>
<link rel="stylesheet" href="assets/app.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#e8481f">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MockTest">
</head>
<body>

<header class="nav">
  <div class="nav-in">
    <a class="brand" href="index.html"><span class="brand-logo">S</span><span><b>SMEAG MockTest</b><small>Learn · Practice · Test · Repeat</small></span></a>
    <div class="nav-right" style="margin-left:auto">
      <a class="btn ghost sm" href="login.html"><span data-en>Login</span><span data-ko>로그인</span></a>
    </div>
  </div>
</header>

<div class="auth">
  <div class="auth-card">
    <span class="pill"><span data-en>Free 1-week Lite pass</span><span data-ko>무료 1주 Lite 패스</span></span>
    <h1 class="mt-16"><span data-en>Join MockTest</span><span data-ko>MockTest 가입</span></h1>
    <p class="sub"><span data-en>Create a free account to take the SET 1 mock test.</span><span data-ko>무료 계정을 만들고 SET 1 모의고사에 응시하세요.</span></p>
    <form onsubmit="event.preventDefault();location.href='dashboard.html'">
      <div class="field"><label data-en>Name</label><label data-ko>이름</label><input type="text" placeholder="Sunny" required></div>
      <div class="field"><label data-en>Email</label><label data-ko>이메일</label><input type="email" placeholder="you@example.com" required></div>
      <div class="field"><label data-en>Password</label><label data-ko>비밀번호</label><input type="password" placeholder="••••••••" required></div>
      <button class="btn brand block lg" type="submit"><span data-en>Sign up free</span><span data-ko>무료 가입</span></button>
    </form>
    <div class="auth-alt"><span data-en>Already have an account?</span><span data-ko>이미 계정이 있으신가요?</span>
      <a href="login.html"><span data-en>Log in</span><span data-ko>로그인</span></a></div>
  </div>
</div>

<script src="assets/app.js"></script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}</script>
</body>
</html>
