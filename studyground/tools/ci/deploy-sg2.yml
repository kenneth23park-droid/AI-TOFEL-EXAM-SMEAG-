# main 에 studyground/sg2/ 변경이 푸시되면 프로덕션으로 자동 배포.
# Vercel↔GitHub 앱 연동 대신 토큰으로 배포하므로 저장소 소유자 승인이 필요 없다.
on:
  push:
    branches: [main]
    paths:
      - 'studyground/sg2/**'
      - '.github/workflows/deploy-sg2.yml'
  workflow_dispatch:

concurrency:
  group: deploy-sg2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_2dm8OcEEEVPKcelKEMlZTzAR
      VERCEL_PROJECT_ID: prj_KZVPBfpDQ7dLpvaSsPI2rA10WF3V
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 겹침 검사를 **배포 직전에** 다시 돌린다. 이유가 두 가지다.
      #   1) 겹친 문항이 학생에게 나가는 경로를 여기서 끊는다 — high 면 배포가 붙지 않는다.
      #   2) 올라가는 config/dup-report.* 가 올라가는 콘텐츠로 방금 만든 것이 된다.
      #      리포트는 손으로 돌려 커밋하는 파일이라 낡기 쉽고, 낡은 리포트는
      #      화면에 "겹침 없음"이라고 거짓말을 한다. 라이브에서는 그럴 수 없게 한다.
      # 판정 기준은 sg2/assets/dup-core.js 한 벌이므로 여기와 화면이 다른 답을 내지 않는다.
      - name: 겹침 검사 (배포 차단)
        run: node studyground/tools/dup_check.js

      - name: Install Vercel CLI
        run: npm install -g vercel@54

      # 정적 사이트라 빌드 단계가 없다. 소스를 그대로 올리면 Vercel 이 그대로 서빙한다.
      # 업로드 대상에서 _screens/, REPORT.md 를 빼는 건 sg2/.vercelignore 가 처리.
      - name: Deploy to production
        working-directory: studyground/sg2
        run: |
          url=$(vercel deploy --prod --yes --token="$VERCEL_TOKEN")
          echo "Deployed: $url"
          echo "### Deployed :rocket: $url" >> "$GITHUB_STEP_SUMMARY"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
