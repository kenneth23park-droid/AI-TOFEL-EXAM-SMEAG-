<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scoring diagnostics · SMEAG StudyGround</title>
<!--
  AI 채점이 "Sign-in is required" 로 거절당한 자리를 원격에서 가르기 위한 화면.

  왜 별도 페이지인가. sw.js 의 fetch 는 cache-first 이고 캐시에 있으면 네트워크를
  아예 보지 않는다 — 그래서 고친 파일이 기기에 도착했는지 그 기기 밖에서는 알 수 없다.
  이 파일은 어느 판의 셸 목록에도 없어서 캐시에 없다. 열면 반드시 네트워크로 간다.

  세션은 localStorage 에서 직접 읽는다. sg-auth.js 를 부르면 그 자체가 캐시된 옛
  사본일 수 있어, 진단이 진단 대상에 기대는 꼴이 된다.

  화면에 토큰 전문은 찍지 않는다 — 앞 10자와 만료 시각이면 가르는 데 충분하다.
-->
<link rel="stylesheet" href="assets/app.css">
<style>
  body { max-width: 820px; margin: 0 auto; padding: 24px 18px 60px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .sub { color: #6b8083; font-size: 14px; margin: 0 0 22px; }
  .row { border: 1px solid #d5e4e2; border-radius: 12px; padding: 14px 16px; margin: 10px 0; }
  .row h2 { font-size: 15px; margin: 0 0 6px; }
  .v { font-family: ui-monospace, Menlo, monospace; font-size: 13px; white-space: pre-wrap;
       word-break: break-all; color: #33474a; }
  .ok   { color: #1a7f37; font-weight: 700; }
  .bad  { color: #d1242f; font-weight: 700; }
  .warn { color: #9a6700; font-weight: 700; }
  .verdict { border: 2px solid #0e8f82; border-radius: 12px; padding: 16px; margin: 18px 0;
             font-size: 15px; line-height: 1.6; }
  button { padding: 10px 18px; border-radius: 999px; border: 0; background: #0e8f82;
           color: #fff; font-weight: 800; font-size: 14px; cursor: pointer; }
</style>
</head>
<body>

<h1>Scoring diagnostics</h1>
<p class="sub">AI 채점이 거절당하는 이유를 가른다. 이 화면은 캐시를 타지 않는다.</p>

<div class="row"><h2>1. 이 기기에 도착한 판 (build)</h2><div class="v" id="d-build">…</div></div>
<div class="row"><h2>2. 서비스워커 캐시</h2><div class="v" id="d-sw">…</div></div>
<div class="row"><h2>3. 저장된 세션</h2><div class="v" id="d-sess">…</div></div>
<div class="row"><h2>4. Supabase 가 이 토큰을 받아 주는가</h2><div class="v" id="d-user">…</div></div>
<div class="row"><h2>5. 채점 서버(/api/score)가 이 토큰을 받아 주는가</h2><div class="v" id="d-api">…</div></div>
<div class="row"><h2>6. 스피킹 — 녹음은 어디에 있는가</h2><div class="v" id="d-speak">…</div></div>

<div class="verdict" id="verdict">진단 중…</div>

<p><button id="again" type="button">다시 검사</button>
   <button id="nuke" type="button" style="background:#6b8083">캐시 비우고 새로 받기</button></p>

<script>
(function () {
  'use strict';

  var URL_ = 'https://qrmidnmlethqvdbmnyun.supabase.co';
  var ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFybWlkbm1sZXRocXZkYm1ueXVuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3Mzg3NzQsImV4cCI6MjEwMTMxNDc3NH0.U2cprYXkpIS_1tSAiEjCFuHAztZRwIIK6DYCCowgxg4';

  function $(id) { return document.getElementById(id); }
  function set(id, html) { $(id).innerHTML = html; }
  function tag(cls, s) { return '<span class="' + cls + '">' + s + '</span>'; }
  function head(t) { return t ? String(t).slice(0, 10) + '…' : '(없음)'; }

  var R = {};   // 단계별 결과 — 마지막에 이걸로 판정을 쓴다

  /* 1. 이 기기가 들고 있는 판. 라이브의 version.json 과 견준다.
        version.json 은 sw 가 캐시를 지나치게 두는 주소라 늘 네트워크에서 온다. */
  function step1() {
    var b = window.SG_BUILD_LOCAL || null;
    return fetch('assets/build-version.js', { cache: 'no-store' })
      .then(function (r) { return r.text(); })
      .then(function (txt) {
        var m = /"version":\s*"([^"]+)"/.exec(txt);
        var served = m ? m[1] : '(못 읽음)';
        return fetch('version.json', { cache: 'no-store' })
          .then(function (r) { return r.json(); })
          .then(function (live) {
            R.served = served; R.live = live.version;
            var same = served === live.version;
            set('d-build',
              '서버가 지금 주는 판 : ' + tag(same ? 'ok' : 'bad', served) + '\n' +
              '라이브 최신 판      : ' + live.version + '\n' +
              (same ? '' : tag('bad', '⚠ 서버 응답이 최신이 아니다 — 배포가 덜 끝났다.')));
          });
      })
      .catch(function (e) { set('d-build', tag('bad', '읽기 실패: ' + e.message)); });
  }

  /* 2. 셸 캐시에 어떤 판이 남아 있는가. 여기에 옛 판 이름이 살아 있으면
        review.html 은 그 안의 옛 사본으로 열리고 있다는 뜻이다. */
  function step2() {
    if (!window.caches) { set('d-sw', '(이 브라우저에 Cache API 가 없다)'); return Promise.resolve(); }
    return caches.keys().then(function (keys) {
      return caches.match('assets/sg-results.js').then(function (hit) {
        return (hit ? hit.text() : Promise.resolve('')).then(function (body) {
          var fixed = body.indexOf('SESSION_GONE') >= 0;
          R.cachedFixed = !hit || fixed;
          var reg = navigator.serviceWorker && navigator.serviceWorker.controller;
          set('d-sw',
            '캐시 이름          : ' + (keys.join(', ') || '(없음)') + '\n' +
            '제어 중인 워커     : ' + (reg ? reg.scriptURL : '(없음 — 이 탭은 워커 제어 밖)') + '\n' +
            '캐시된 sg-results  : ' + (!hit ? '(캐시에 없음)'
                : fixed ? tag('ok', '고친 판(SESSION_GONE 있음)')
                        : tag('bad', '옛 판 — 이 기기는 아직 옛 채점 코드를 쓴다')));
        });
      });
    }).catch(function (e) { set('d-sw', '확인 실패: ' + e.message); });
  }

  /* 3. localStorage 의 세션. sg-auth.js 를 부르지 않고 직접 읽는다. */
  function step3() {
    var s = null;
    try { s = JSON.parse(localStorage.getItem('sg2_auth_v1') || 'null'); } catch (e) {}
    R.sess = s;
    if (!s) {
      set('d-sess', tag('bad', '세션 없음 — 이 브라우저는 로그아웃 상태다.'));
      return;
    }
    var now = Math.floor(Date.now() / 1000);
    var left = (s.expires_at || 0) - now;
    R.left = left;
    set('d-sess',
      '사용자        : ' + ((s.user && (s.user.name || s.user.email)) || '(이름 없음)') +
        '  role=' + ((s.user && s.user.role) || '(없음)') + '\n' +
      'access token  : ' + head(s.access_token) + '\n' +
      'refresh token : ' + head(s.refresh_token) + '\n' +
      '만료까지      : ' + (left > 0 ? tag('ok', left + '초 (' + Math.round(left / 60) + '분)')
                                     : tag('warn', Math.abs(left) + '초 전에 만료됨')) + '\n' +
      '기기 시계     : ' + new Date().toISOString());
  }

  /* 4. Supabase 에 직접 물어본다 — 토큰이 살아 있는지의 진짜 답. */
  function step4() {
    var s = R.sess;
    if (!s || !s.access_token) { set('d-user', '(토큰이 없어 건너뜀)'); return; }
    return fetch(URL_ + '/auth/v1/user', {
      headers: { apikey: ANON, Authorization: 'Bearer ' + s.access_token }
    }).then(function (r) {
      R.userStatus = r.status;
      return r.text().then(function (t) {
        set('d-user', 'HTTP ' + tag(r.ok ? 'ok' : 'bad', r.status) + '\n' + t.slice(0, 300));
      });
    }).catch(function (e) {
      R.userStatus = 0;
      set('d-user', tag('bad', '네트워크 실패: ' + e.message));
    });
  }

  /* 5. 채점 서버에 같은 토큰으로 묻는다. GET 은 채점을 돌리지 않고 provider 목록만
        돌려주므로(api/score.js), 토큰도 서버 설정도 돈 한 푼 없이 확인된다. */
  function step5() {
    var s = R.sess;
    if (!s || !s.access_token) { set('d-api', '(토큰이 없어 건너뜀)'); return; }
    return fetch('/api/score', {
      headers: { Authorization: 'Bearer ' + s.access_token }
    }).then(function (r) {
      R.apiStatus = r.status;
      return r.text().then(function (t) {
        set('d-api', 'HTTP ' + tag(r.ok ? 'ok' : 'bad', r.status) + '\n' + t.slice(0, 400));
      });
    }).catch(function (e) {
      R.apiStatus = 0;
      set('d-api', tag('bad', '네트워크 실패: ' + e.message));
    });
  }

  /* 6. 스피킹이 'no_transcript' 로 건너뛰어지는 자리를 가른다.
     *
     * 채점 서버는 음성을 볼 수 없다 — 버킷 toefl-recordings 의 {owner}/{session}/
     * 아래 파일을 내려받아 전사한 뒤에야 채점한다(api/score.js speechOf).
     * 그러니 스피킹만 안 매겨질 때 물어야 할 것은 모델이 아니라 "녹음이 거기 있는가" 다.
     *
     * 세 자리를 함께 본다. 버킷(서버) · sg_task_scores 의 전사문 · 이 브라우저의
     * IndexedDB(sg2-media). 셋 중 어디에 있느냐가 처방을 가른다 — 특히 2026-08-12
     * 시험처럼 업로드가 400 으로 전부 거절당한 자리는 원본이 응시 기기에만 남는다. */
  function step6() {
    var s = R.sess;
    if (!s || !s.access_token) { set('d-speak', '(토큰이 없어 건너뜀)'); return; }
    var uid = s.user && s.user.id;
    var H = { apikey: ANON, Authorization: 'Bearer ' + s.access_token };

    // 가장 최근 응시 한 건. RLS 가 본인 것만 내어 준다.
    return fetch(URL_ + '/rest/v1/sg_results?select=session,set_code,submitted_at' +
                 '&order=submitted_at.desc&limit=1', { headers: H })
      .then(function (r) { return r.ok ? r.json() : []; })
      .then(function (rows) {
        var row = rows && rows[0];
        if (!row) { set('d-speak', '(이 계정에 올라온 응시가 없다)'); return; }
        R.session = row.session;

        var scores = fetch(URL_ + '/rest/v1/sg_task_scores?select=question_id,skill,ai_score,score,transcript,media_path,ai_error' +
                           '&session=eq.' + encodeURIComponent(row.session), { headers: H })
          .then(function (r) { return r.ok ? r.json() : []; })['catch'](function () { return []; });

        // 버킷은 목록 API 로 센다. 정책이 첫 칸(uid)을 auth.uid() 와 대조한다.
        var bucket = fetch(URL_ + '/storage/v1/object/list/toefl-recordings', {
          method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json' }, H),
          body: JSON.stringify({ prefix: uid + '/' + row.session, limit: 200 })
        }).then(function (r) { return r.ok ? r.json() : { _err: r.status }; })
          ['catch'](function (e) { return { _err: e.message }; });

        // 이 브라우저에 남은 원본. 응시한 그 PC 에서 열었다면 여기 있다.
        var local = new Promise(function (done) {
          if (!window.indexedDB) return done(-1);
          var req;
          try { req = indexedDB.open('sg2-media'); } catch (e) { return done(-1); }
          req.onerror = function () { done(-1); };
          req.onsuccess = function () {
            var db = req.result;
            if (!db.objectStoreNames.contains('recordings')) { db.close(); return done(0); }
            var t = db.transaction('recordings', 'readonly').objectStore('recordings').count();
            t.onsuccess = function () { done(t.result); db.close(); };
            t.onerror = function () { done(-1); db.close(); };
          };
          setTimeout(function () { done(-1); }, 4000);
        });

        return Promise.all([scores, bucket, local]).then(function (a) {
          var rows2 = a[0] || [], b = a[1], n = a[2];
          // skill 은 서버가 채점 행에 직접 새긴다(api/score.js row()) — 문항 id 모양을
          // 짐작하지 않는다. SET 9 는 'set9-S1-q01' 이라 id 로는 가릴 수 없다.
          var spk = rows2.filter(function (x) { return String(x.skill || '').toLowerCase() === 'speaking'; });
          var withText = spk.filter(function (x) { return x.transcript; }).length;
          var withScore = spk.filter(function (x) { return x.ai_score !== null && x.ai_score !== undefined; }).length;
          var files = Array.isArray(b) ? b.filter(function (f) { return f && f.name; }) : [];
          R.bucketFiles = Array.isArray(b) ? files.length : -1;
          R.localFiles = n;
          R.spkRows = spk.length;
          var errs = {};
          spk.forEach(function (x) { if (x.ai_error) errs[x.ai_error] = (errs[x.ai_error] || 0) + 1; });
          var errLine = Object.keys(errs).map(function (k) { return k + ' ×' + errs[k]; }).join(' | ');

          set('d-speak',
            '응시            : ' + row.set_code + '  ' + String(row.submitted_at).slice(0, 16) + '\n' +
            'session         : ' + row.session + '\n' +
            '스피킹 채점 행  : ' + spk.length + '개 (점수 있음 ' + withScore + ' · 전사문 있음 ' + withText + ')\n' +
            '버킷의 녹음     : ' + (!Array.isArray(b)
                ? tag('bad', '목록을 못 읽음 (' + (b && b._err) + ')')
                : files.length ? tag('ok', files.length + '개')
                               : tag('bad', '0개 — 서버에 녹음이 없다')) + '\n' +
            '이 브라우저 원본: ' + (n < 0 ? '(확인 실패)'
                : n ? tag('warn', n + '개 (IndexedDB sg2-media)')
                    : '0개') +
            (errLine ? '\n마지막 오류     : ' + tag('bad', errLine) : ''));
        });
      })['catch'](function (e) { set('d-speak', tag('bad', '확인 실패: ' + e.message)); });
  }

  /* 판정. 네 가지 경우가 서로 다른 처방을 가진다. */
  function verdict() {
    var v = $('verdict'), out;
    if (!R.sess) {
      out = '<b>세션이 없다.</b> 이 브라우저는 로그아웃 상태다 — 로그인부터 하면 된다.';
    } else if (R.userStatus === 200 && R.apiStatus === 200) {
      out = '<b class="ok">토큰도 서버도 정상이다.</b> 지금 채점을 다시 걸면 통과한다. ' +
            '그래도 실패한다면 남은 것은 이 기기에 옛 채점 코드가 남은 경우다 — 위 2번을 보라.';
    } else if (R.userStatus === 200 && R.apiStatus !== 200) {
      out = '<b class="bad">토큰은 살아 있는데 채점 서버가 거절했다.</b> ' +
            '문제는 로그인이 아니라 서버 쪽이다 — Vercel 의 SUPABASE_ANON_KEY 가 ' +
            '엉뚱한 값으로 덮여 있으면 서버가 멀쩡한 토큰을 못 알아본다. (5번의 본문을 보라.)';
    } else if (R.userStatus === 401 || R.userStatus === 403) {
      out = '<b class="bad">세션이 서버에서 끊겼다.</b> 만료 시각이 남아 있어도 소용없다 — ' +
            '같은 계정을 쓰는 다른 기기에서 로그아웃했을 때 이렇게 된다. ' +
            '로그아웃했다 다시 로그인하면 풀린다.';
    } else {
      out = '<b class="warn">네트워크가 막혀 판정할 수 없다.</b> 회선을 확인하고 다시 검사하라.';
    }
    /* 스피킹은 별도의 관문이 하나 더 있다 — 녹음이 서버에 없으면 모델을 아무리
       다시 불러도 'no_transcript' 로 건너뛴다. 처방이 다르므로 따로 적는다. */
    if (R.spkRows !== undefined) {
      if (R.bucketFiles === 0 && R.localFiles > 0) {
        out += '<br><br><b class="bad">스피킹: 녹음이 서버에 없고 이 브라우저에만 있다.</b> ' +
               '채점을 다시 걸어도 소용없다 — 먼저 <a href="recover-recordings.html">recover-recordings.html</a> ' +
               '에서 Save(파일로 먼저 확보) → Upload 를 하고, 그 다음에 채점을 건다.';
      } else if (R.bucketFiles === 0) {
        out += '<br><br><b class="bad">스피킹: 녹음이 서버에도 이 브라우저에도 없다.</b> ' +
               '원본은 시험을 친 그 컴퓨터의 브라우저에 남아 있다 — 그 PC 에서 ' +
               'recover-recordings.html 을 열어 Save → Upload 해야 한다.';
      } else if (R.bucketFiles > 0) {
        out += '<br><br><b class="ok">스피킹: 녹음이 서버에 ' + R.bucketFiles + '개 있다.</b> ' +
               '전사와 채점이 가능한 상태다 — 채점을 다시 걸면 매겨진다.';
      }
    }
    if (R.cachedFixed === false) {
      out += '<br><br><b class="bad">그리고 이 기기에는 옛 채점 코드가 남아 있다.</b> ' +
             '아래 “캐시 비우고 새로 받기” 를 누르면 고친 판으로 갈아 끼운다.';
    }
    v.innerHTML = out;
  }

  function run() {
    ['d-build', 'd-sw', 'd-sess', 'd-user', 'd-api', 'd-speak'].forEach(function (id) { set(id, '…'); });
    $('verdict').textContent = '진단 중…';
    R = {};
    Promise.resolve()
      .then(step1).then(step2).then(step3).then(step4).then(step5).then(step6).then(verdict)
      .catch(function (e) { $('verdict').textContent = '진단 실패: ' + e.message; });
  }

  /* 캐시를 통째로 버리고 워커를 떼어 낸다. 지우는 것은 내려받아 둔 사본뿐 —
     응시 기록도 답안도 localStorage 와 IndexedDB 에 그대로 남는다. */
  $('nuke').onclick = function () {
    var jobs = [];
    if (window.caches) jobs.push(caches.keys().then(function (ks) {
      return Promise.all(ks.map(function (k) { return caches.delete(k); }));
    }));
    if (navigator.serviceWorker) jobs.push(
      navigator.serviceWorker.getRegistrations().then(function (rs) {
        return Promise.all(rs.map(function (r) { return r.unregister(); }));
      }));
    Promise.all(jobs).then(function () {
      $('verdict').innerHTML = '<b class="ok">캐시를 비웠다.</b> 이 창을 닫고 채점 화면을 다시 열면 최신 판으로 열린다.';
    });
  };

  $('again').onclick = run;
  run();
})();
</script>
</body>
</html>
