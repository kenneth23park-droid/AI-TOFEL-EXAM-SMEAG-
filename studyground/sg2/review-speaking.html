/* 스피킹 리뷰 전용. 한 문항 = 왼쪽 "무엇이 나왔나" · 오른쪽 "무엇을 말했고 어떻게 채점됐나". */
.sp-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 24px; }

.sp-bar { margin-top: 14px; padding: 12px 14px; background: var(--card);
  border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.sp-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.sp-row + .sp-row { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.sp-task { border: 1px solid var(--line-2); background: #fff; color: var(--ink-2);
  padding: 7px 13px; border-radius: 999px; font-size: 12.5px; font-weight: 750; }
.sp-task.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.sp-task b { font-weight: 800; }
.sp-count { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 999px;
  background: var(--cream-2); color: var(--ink-2); font-size: 11px; font-weight: 800; }
.sp-task.on .sp-count { background: rgba(255,255,255,.22); color: #fff; }

/* 문항 이동 — 번호 위, 점수 아래. 어느 문항이 무너졌는지 한 줄로 보이게 한다. */
.sp-pill { min-width: 54px; padding: 5px 9px; border-radius: 10px; text-align: center;
  border: 1px solid var(--line-2); background: #fff; line-height: 1.2; }
.sp-pill span { display: block; font-size: 11px; font-weight: 800; color: var(--muted); }
.sp-pill b { display: block; font-size: 13px; font-weight: 800; color: var(--brand-ink); }
.sp-pill.none b { color: var(--dim); font-weight: 700; }
.sp-pill.on { background: var(--ink); border-color: var(--ink); }
.sp-pill.on span, .sp-pill.on b { color: #fff; }

.sp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px;
  align-items: start; }
@media (max-width: 900px) { .sp-grid { grid-template-columns: 1fr; } }

.sp-lab { font-size: 11px; font-weight: 800; color: var(--muted);
  text-transform: uppercase; letter-spacing: .06em; }
.sp-pic { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: #fff; }
.sp-note { border-radius: 12px; padding: 12px 14px; }
.sp-note.ref { background: #eef4ff; border: 1px solid #d3e0fb; }
.sp-note.ask { background: #fff8e8; border: 1px solid #f2e2bd; }
.sp-note p { font-size: 15px; font-weight: 650; margin-top: 4px; }
.sp-note.ref p { color: #1c4ed8; }
audio { width: 100%; height: 36px; margin-top: 6px; }

.sp-score { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.sp-score b { margin-left: auto; background: var(--brand-soft); color: var(--brand-ink);
  padding: 5px 13px; border-radius: 999px; font-size: 15px; font-weight: 850; }

/* 대조 요약 — 정확도 · 맞은 낱말 · 원문 낱말. */
.sp-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
.sp-stat { background: var(--cream); border-radius: 12px; padding: 10px; text-align: center; }
.sp-stat b { display: block; font-size: 21px; font-weight: 850; line-height: 1.2; }
.sp-stat span { font-size: 11px; color: var(--muted); font-weight: 700; }
.sp-stat.ok b { color: var(--ok); }
.sp-tags { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
.sp-tag { border-radius: 9px; padding: 5px 9px; font-size: 11.5px; font-weight: 750; text-align: center; }
.sp-tag.miss { background: #fdeceb; color: #b3261e; }
.sp-tag.add { background: #fdf4e3; color: #92610a; }
.sp-tag.sub { background: #f0eefb; color: #4b3fa8; }

.sp-diff { margin-top: 10px; font-size: 14px; line-height: 1.9; word-break: break-word; }
.sp-diff i { font-style: normal; padding: 1px 4px; border-radius: 5px; }
.sp-diff i.del { background: #fdeceb; color: #b3261e; text-decoration: line-through; }
.sp-diff i.ins { background: #e7f6ec; color: #14713c; }

.sp-crit { margin-top: 10px; }
.sp-crit div { display: flex; gap: 8px; align-items: baseline; padding: 7px 0;
  border-top: 1px solid var(--line); font-size: 13px; }
.sp-crit div:first-child { border-top: 0; }
.sp-crit b { flex: none; min-width: 132px; font-weight: 800; }
.sp-crit em { flex: none; font-style: normal; font-weight: 850; color: var(--brand-ink); }
.sp-crit span { color: var(--ink-2); }
</style>

<script>
/* 한 응시의 스피킹을 문항 하나씩 편다.
 *   review-speaking.html?session=<세션 id>              내 응시
 *   review-speaking.html?session=<세션 id>&owner=<uuid> 다른 학생 — 선생님·관리자만
 *
 * review.html 은 시험 전체를 표로 훑는 화면이라 스피킹 한 문항에 필요한 것 — 무엇을
 * 들려줬는지(그림·원문·오디오)와 무엇을 말했는지(녹음·전사) — 를 나란히 놓을 자리가
 * 없다. 스피킹 점수에 대한 질문은 거의 언제나 "왜 이 점수인가" 하나이고, 그 답은 원문과
 * 전사를 같은 화면에서 겹쳐 봐야 나온다. 그래서 이 화면만 따로 있다.
 *
 * 이 화면은 읽기 전용이다. 점수를 고치고 확정하는 자리는 review.html 하나뿐이다 —
 * 확정 장치가 두 군데 있으면 어느 쪽이 최신인지 아무도 모른다.
 *
 * 권한의 정본은 화면이 아니라 Supabase RLS 다. 여기서 막는 것은 안내다.
 */
(function () {
  'use strict';

  var qs = new URLSearchParams(location.search);
  var SESSION = qs.get('session') || '';
  var OWNER = qs.get('owner') || '';

  var $ = function (id) { return document.getElementById(id); };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function notice(text) { $('notice').innerHTML = '<p>' + esc(text) + '</p>';
                          $('notice').classList.remove('hide'); }
  function when(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d)) return '';
    function p(n) { return (n < 10 ? '0' : '') + n; }
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
           ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  /* ── 원문 대조 ────────────────────────────────────────────
   *
   * 낱말을 고르고 세는 규칙은 서버 채점기(app/scoring/rubric.py 의 _repeat_tokens ·
   * compare_repeat)와 같아야 한다. 화면이 "6/7 맞음" 이라 하는데 점수는 다른 셈법으로
   * 나왔다면, 학생이 보는 근거가 근거가 아니게 된다. 그래서 여기서도 소문자로 낮추고,
   * 굽은 따옴표를 곧게 펴고, 아포스트로피만 낱말의 일부로 남긴 채 구두점에서 자른다.
   */
  function tokens(text) {
    var body = String(text == null ? '' : text).toLowerCase().replace(/[‘’ʼ]/g, "'");
    return body.replace(/[^a-z0-9']+/g, ' ').split(' ').filter(function (t) { return t; });
  }

  /* 최장 공통 부분수열. 문장 하나(길어야 스무 낱말)라 표를 통째로 채워도 싸다. */
  function diff(ref, hyp) {
    var n = ref.length, m = hyp.length, i, j;
    var L = [];
    for (i = 0; i <= n; i++) { L.push([]); for (j = 0; j <= m; j++) L[i].push(0); }
    for (i = n - 1; i >= 0; i--) {
      for (j = m - 1; j >= 0; j--) {
        L[i][j] = ref[i] === hyp[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
      }
    }
    var ops = [];
    i = 0; j = 0;
    while (i < n && j < m) {
      if (ref[i] === hyp[j]) { ops.push({ t: 'eq', w: ref[i] }); i++; j++; }
      else if (L[i + 1][j] >= L[i][j + 1]) { ops.push({ t: 'del', w: ref[i] }); i++; }
      else { ops.push({ t: 'ins', w: hyp[j] }); j++; }
    }
    while (i < n) { ops.push({ t: 'del', w: ref[i] }); i++; }
    while (j < m) { ops.push({ t: 'ins', w: hyp[j] }); j++; }
    return ops;
  }

  /**
   * 대조 요약. 바뀐 낱말(substituted)은 빠뜨림(missing)이자 덧붙임(added)이기도 하다 —
   * 세 숫자를 더해서 총계를 맞추려 들면 안 된다. 셋은 겹쳐서 세는 서로 다른 관점이다:
   *   missing     원문에 있는데 말하지 않은 낱말
   *   added       원문에 없는데 말한 낱말
   *   substituted 그중 자리를 맞바꾼 쌍의 수 (missing·added 양쪽에 이미 들어 있다)
   */
  function compare(refText, hypText) {
    var ref = tokens(refText), hyp = tokens(hypText);
    if (!ref.length) return null;
    var ops = diff(ref, hyp);
    var matched = 0, missing = 0, added = 0, substituted = 0;
    var k = 0;
    while (k < ops.length) {
      if (ops[k].t === 'eq') { matched++; k++; continue; }
      var d = 0, a = 0;
      while (k < ops.length && ops[k].t === 'del') { d++; k++; }
      while (k < ops.length && ops[k].t === 'ins') { a++; k++; }
      missing += d; added += a; substituted += Math.min(d, a);
    }
    return {
      ops: ops, total: ref.length, said: hyp.length, matched: matched,
      missing: missing, added: added, substituted: substituted,
      accuracy: Math.round(matched / ref.length * 100)
    };
  }

  /* ── 이 응시 ─────────────────────────────────────────────── */

  var RES = null, PACK = null, ITEMS = [], TASKS = {}, TASKIDS = [], task = 0, idx = 0;

  /** 팩의 스피킹 문항을 화면 순서대로 편다. 과제(모듈)별로 묶어 둔다. */
  function collect(pack) {
    var out = [];
    (pack && pack.sections || []).forEach(function (sec) {
      if (String(sec.id || '').toLowerCase() !== 'speaking') return;
      (sec.modules || []).forEach(function (mod) {
        (mod.blocks || []).forEach(function (blk) {
          (blk.questions || []).forEach(function (q) {
            out.push({ q: q, mod: mod, blk: blk });
          });
        });
      });
    });
    return out;
  }

  function tasksOf(items) {
    var ids = [], seen = {};
    items.forEach(function (it) {
      if (!seen[it.mod.id]) { seen[it.mod.id] = true; ids.push(it.mod.id); }
    });
    return ids;
  }
  function inTask(id) {
    return ITEMS.filter(function (it) { return it.mod.id === id; });
  }

  /** 교사가 확정했으면 그 점수, 아니면 AI 초안. 둘 다 없으면 null. */
  function scoreOf(row) {
    if (!row) return null;
    if (row.teacher_score !== null && row.teacher_score !== undefined) return Number(row.teacher_score);
    if (row.ai_score !== null && row.ai_score !== undefined) return Number(row.ai_score);
    return null;
  }
  function fmt(v) { return v === null ? '—' : v.toFixed(2); }

  /* 짧은 이름. Task 1 의 7문항은 S1…S7, Task 2 의 4문항은 Q1…Q4 로 부른다 —
     문항 번호(no)는 시험 전체 통번호(8~11)라 과제 안에서 몇 번째인지 알 수 없다. */
  function shortName(taskIndex, i) {
    return (taskIndex === 0 ? 'S' : 'Q') + (i + 1);
  }

  function paintTasks() {
    $('tasks').innerHTML = TASKIDS.map(function (id, i) {
      var list = inTask(id);
      var label = (list[0] && list[0].mod.label) || id;
      return '<button class="sp-task' + (i === task ? ' on' : '') + '" data-task="' + i + '">' +
        esc(label) + '<span class="sp-count">' + list.length + '</span></button>';
    }).join('');
    $('tasks').onclick = function (e) {
      var b = e.target.closest('[data-task]');
      if (!b) return;
      task = Number(b.getAttribute('data-task'));
      idx = 0;
      paint();
    };
  }

  function paintPills() {
    var list = inTask(TASKIDS[task]);
    var html = '<button class="btn ghost sm" data-step="-1">‹ Prev</button>' +
               '<button class="btn ghost sm" data-step="1">Next ›</button>' +
               '<span class="sp-meta" style="margin:0 4px">Question ' + (idx + 1) +
                 ' of ' + list.length + '</span>';
    html += list.map(function (it, i) {
      var v = scoreOf(TASKS[it.q.id]);
      return '<button class="sp-pill' + (i === idx ? ' on' : '') + (v === null ? ' none' : '') +
        '" data-go="' + i + '"><span>' + esc(shortName(task, i)) + '</span><b>' +
        (v === null ? '—' : v.toFixed(2)) + '</b></button>';
    }).join('');
    $('pills').innerHTML = html;
    $('pills').onclick = function (e) {
      var go = e.target.closest('[data-go]'), step = e.target.closest('[data-step]');
      if (go) { idx = Number(go.getAttribute('data-go')); paint(); return; }
      if (!step) return;
      var n = idx + Number(step.getAttribute('data-step'));
      if (n < 0 || n >= list.length) return;
      idx = n;
      paint();
    };
  }

  function paintLeft(it) {
    var q = it.q;
    var repeat = q.kind === 'repeat';
    var html = '';
    if (q.image) {
      html += '<div class="sp-pic"><img src="' + esc(q.image) + '" alt=""></div>';
    }
    if (q.script) {
      html += '<div class="sp-note ' + (repeat ? 'ref' : 'ask') + '" style="margin-top:14px">' +
        '<div class="sp-lab">' + (repeat ? 'Reference text' : 'What the interviewer asked') + '</div>' +
        '<p>' + esc(q.script) + '</p></div>';
    }
    if (q.audio) {
      html += '<div style="margin-top:14px"><div class="sp-lab">Original audio</div>' +
        '<audio controls preload="none" src="' + esc(q.audio) + '"></audio></div>';
    }
    html += '<div class="sp-meta" style="margin-top:12px">' +
      esc(it.mod.label || it.mod.id) + ' · question ' + (q.no != null ? q.no : '—') +
      ' of the test' + (q.respondSec ? ' · ' + q.respondSec + 's to answer' : '') + '</div>';
    $('left').innerHTML = html;
  }

  function statCard(cmp) {
    return '<div class="card" style="margin-top:14px">' +
      '<div class="sp-lab">Accuracy highlights</div>' +
      '<div class="sp-stats">' +
        '<div class="sp-stat"><b>' + cmp.accuracy + '%</b><span>Accuracy</span></div>' +
        '<div class="sp-stat ok"><b>' + cmp.matched + '</b><span>Correct</span></div>' +
        '<div class="sp-stat"><b>' + cmp.total + '</b><span>Reference words</span></div>' +
      '</div>' +
      '<div class="sp-tags">' +
        '<div class="sp-tag miss">Missing: ' + cmp.missing + '</div>' +
        '<div class="sp-tag add">Added: ' + cmp.added + '</div>' +
        '<div class="sp-tag sub">Substituted: ' + cmp.substituted + '</div>' +
      '</div>' +
      '<div class="sp-diff">' + cmp.ops.map(function (o) {
        if (o.t === 'eq') return esc(o.w);
        return '<i class="' + o.t + '">' + esc(o.w) + '</i>';
      }).join(' ') + '</div>' +
      '<div class="sp-meta" style="margin-top:8px">Struck-through words are in the sentence but ' +
        'were not said; green words were said but are not in the sentence. Words are compared ' +
        'in lower case without punctuation — the same way the score is worked out.</div>' +
    '</div>';
  }

  function paintRight(it) {
    var q = it.q;
    var row = TASKS[q.id] || null;
    var v = scoreOf(row);
    var rub = (row && row.ai_rubric) || {};
    var confirmed = !!(row && row.confirmed_at);
    var html = '';

    html += '<div class="card sp-score">' +
      '<span class="sp-lab">' + (confirmed ? 'Teacher-confirmed score' : 'AI draft score') + '</span>' +
      '<b>' + fmt(v) + ' / 5.00</b></div>';

    /* 녹음과 전사가 먼저다. 점수에 대한 이의는 거의 전부 "내가 그렇게 말하지 않았다"
       이고, 그 자리에서 들어 보고 옮겨 적힌 글을 봐야 판별이 된다. */
    html += '<div class="card" style="margin-top:14px">' +
      '<div class="sp-lab">Your recording</div>' +
      '<div data-play="' + esc(q.id) + '"><div class="sp-meta" style="margin-top:6px">' +
        'Looking for the recording…</div></div>' +
      '<div class="sp-lab" style="margin-top:14px">Transcription' +
        (row && row.transcript_model ? ' · ' + esc(row.transcript_model) : '') + '</div>' +
      (row && row.transcript
        ? '<p style="font-size:14px;margin-top:4px">' + esc(row.transcript) + '</p>'
        : '<p class="sp-meta" style="margin-top:4px">Not transcribed yet.</p>') +
    '</div>';

    if (row && row.ai_error) {
      html += '<div class="card" style="margin-top:14px"><div class="sp-lab">Scoring failed</div>' +
        '<p style="font-size:13px;margin-top:4px">' + esc(row.ai_error) + '</p></div>';
    } else if (rub.summary || (row && row.teacher_note)) {
      html += '<div class="card" style="margin-top:14px">' +
        '<div class="sp-lab">Overall assessment</div>' +
        (rub.summary ? '<p style="font-size:14px;margin-top:4px">' + esc(rub.summary) + '</p>' : '') +
        (row.teacher_note
          ? '<p style="font-size:14px;margin-top:8px"><b>Teacher</b> — ' + esc(row.teacher_note) + '</p>'
          : '') +
      '</div>';
    } else if (!row) {
      html += '<div class="card" style="margin-top:14px"><div class="sp-lab">Not scored yet</div>' +
        '<p class="sp-meta" style="margin-top:4px">This answer has not been scored. Scoring usually ' +
        'finishes a minute or two after you submit — reload this page to check.</p></div>';
    }

    /* 복창은 원문이 있어야 대조가 성립한다. 팩에 원문이 없는 옛 세트(SET 1)는
       이 카드가 통째로 빠진다 — 없는 근거를 지어내느니 비워 두는 편이 낫다. */
    var cmp = q.kind === 'repeat' && row && row.transcript ? compare(q.script, row.transcript) : null;
    if (cmp) html += statCard(cmp);

    var crit = rub.criteria || [];
    if (crit.length) {
      html += '<div class="card" style="margin-top:14px"><div class="sp-lab">How it was scored</div>' +
        '<div class="sp-crit">' + crit.map(function (c) {
          return '<div><b>' + esc(c.criterion) + '</b>' +
            (c.score === null || c.score === undefined ? '' : '<em>' + Number(c.score).toFixed(1) + '</em>') +
            '<span>' + esc(c.comment || '') + '</span></div>';
        }).join('') + '</div>' +
        (row.ai_model ? '<div class="sp-meta" style="margin-top:8px">' + esc(row.ai_model) + '</div>' : '') +
      '</div>';
    }

    $('right').innerHTML = html;
    wirePlayback(q.id, row);
  }

  function paint() {
    var list = inTask(TASKIDS[task]);
    if (idx >= list.length) idx = 0;
    paintTasks();
    paintPills();
    paintLeft(list[idx]);
    paintRight(list[idx]);
  }

  /* ── 녹음 ────────────────────────────────────────────────
   *
   * 녹음은 두 군데에 있다. 응시한 기기의 IndexedDB 와, 제출 뒤 올라간 비공개 버킷.
   * 앞의 것은 그 기기에서만 열리지만 네트워크 없이 열리고, 뒤의 것은 서명 URL 이라
   * 어느 기기에서나 열린다. 기기 사본을 먼저 찾고, 없을 때만 버킷을 부른다.
   */
  function playerInto(slot, src) {
    var a = document.createElement('audio');
    a.controls = true;
    a.preload = 'none';
    a.src = src;
    slot.innerHTML = '';
    slot.appendChild(a);
  }
  function noRecording(slot, text) {
    slot.innerHTML = '<div class="sp-meta" style="margin-top:6px">' + esc(text) + '</div>';
  }

  function wirePlayback(qid, row) {
    var slot = document.querySelector('[data-play="' + qid + '"]');
    if (!slot) return;
    var S = window.SG_STORE;
    var local = null;
    try {
      if (S && typeof S.getMedia === 'function' && SESSION) {
        /* 진행 중인 다른 시험의 '활성 세션' 표시를 건드리지 않는다. */
        S.open(SESSION, false);
        local = S;
      }
    } catch (e) { local = null; }

    function cloud() {
      var path = row && row.media_path;
      if (!path || !window.SG_AUTH) {
        noRecording(slot, 'No recording is stored for this question.');
        return;
      }
      SG_AUTH.token().then(function (tok) {
        if (!tok) { noRecording(slot, 'Sign in to play the recording.'); return; }
        return fetch(SG_AUTH.url + '/storage/v1/object/sign/toefl-recordings/' +
                     path.split('/').map(encodeURIComponent).join('/'), {
          method: 'POST',
          headers: { apikey: SG_AUTH.anonKey, Authorization: 'Bearer ' + tok,
                     'Content-Type': 'application/json' },
          body: JSON.stringify({ expiresIn: 3600 })
        }).then(function (r) { return r.ok ? r.json() : null; })
          .then(function (j) {
            if (j && j.signedURL) playerInto(slot, SG_AUTH.url + '/storage/v1' + j.signedURL);
            else noRecording(slot, 'The recording could not be opened from this device.');
          });
      })['catch'](function () {
        noRecording(slot, 'The recording could not be opened from this device.');
      });
    }

    if (!local) { cloud(); return; }
    local.getMedia(qid, function (err, rec) {
      // 저장 형식은 {questionKey, blob, mime, …} 다. 아주 옛 기록은 Blob 자체였다.
      var blob = rec && rec.blob ? rec.blob : rec;
      if (err || !blob || !blob.size) { cloud(); return; }
      playerInto(slot, URL.createObjectURL(blob));
    });
  }

  /* ── 시작 ────────────────────────────────────────────────── */

  function render(res) {
    RES = res;
    PACK = SG_RESULTS.pack(res.set_code);
    ITEMS = collect(PACK);
    if (!ITEMS.length) {
      notice('This test set is not loaded on this device, so the speaking questions cannot be shown.');
      return;
    }
    TASKIDS = tasksOf(ITEMS);

    $('meta').textContent = [res.set_code || '', res.mode || '', when(res.submitted_at)]
      .filter(function (x) { return x; }).join(' · ');
    var link = 'review.html?session=' + encodeURIComponent(SESSION) +
               (OWNER ? '&owner=' + encodeURIComponent(OWNER) : '');
    $('all').href = link;
    if (OWNER) $('back').href = 'admin-results.html';

    $('bar').classList.remove('hide');
    $('grid').classList.remove('hide');
    $('foot').textContent = 'Speaking is transcribed from your recording, then scored 0–5 against ' +
      'the official ETS scoring guide. A draft score is the AI’s; a teacher confirms it. ' +
      'Scores are changed on the answer review page.';
    paint();

    var owner = OWNER || res.owner || '';
    SG_RESULTS.tasks(SESSION, owner).then(function (rows) {
      (rows || []).forEach(function (r) { if (r.skill === 'speaking') TASKS[r.question_id] = r; });
      paint();
    })['catch'](function () {});
  }

  function boot() {
    if (!SESSION) { notice('No test was specified.'); return; }
    SG_RESULTS.get(SESSION, OWNER).then(function (res) {
      if (!res) {
        notice('That test result was not found, or you are not allowed to see it.');
        return;
      }
      render(res);
    })['catch'](function () { notice('Could not load the result.'); });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}</script>
