<body>

  <div class="nav-in">

    <nav class="nav-center">
      <a href="tests.html">📝 <span data-en>Mock Tests</span><span data-ko>모의고사</span></a>

      <a class="btn ghost sm" href="admin.html"><span data-en>Admin home</span><span data-ko>관리자 홈</span></a>

<main class="wrap" style="padding-bottom:60px">
  <div class="page-h mt-24" style="display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap">
    <h1 style="font-size:clamp(24px,3.4vw,36px)"><span data-en>Student results</span><span data-ko>학생 응시 결과</span></h1>
    <span class="chip" id="who" style="margin-bottom:8px"></span>
    <a class="btn ghost sm" href="scoring-guide.html" style="margin-left:auto"><span data-en>How we score</span><span data-ko>채점 근거</span></a>
    <button class="btn ghost sm" id="csv"><span data-en>Download CSV</span><span data-ko>CSV 내려받기</span></button>
  </div>

  <div class="card mt-16 hide" id="notice"></div>

  <div class="card mt-16 hide" id="filters" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
    <input id="q" placeholder="Name or student ID" style="flex:1;min-width:220px;padding:10px 13px;border:1px solid var(--line-2);border-radius:11px;font-family:inherit;font-size:14px;background:var(--cream)">
    <select id="set" style="padding:10px 13px;border:1px solid var(--line-2);border-radius:11px;font-family:inherit;font-size:14px;background:#fff"></select>
    <span class="muted" style="font-size:12.5px" id="count"></span>
  </div>

  <div class="card mt-16 hide" id="table-card" style="padding:0;overflow:hidden">
    <div class="table-wrap" style="overflow-x:auto"><table class="rv-table cardify">
      <thead><tr>
        <th><span data-en>Date</span><span data-ko>날짜</span></th>
        <th><span data-en>Student</span><span data-ko>학생</span></th>
        <th class="col-teacher hide"><span data-en>Teacher</span><span data-ko>담당 선생님</span></th>
        <th><span data-en>Test</span><span data-ko>시험</span></th>
        <th><span data-en>Section bands</span><span data-ko>영역별 밴드</span></th>
        <th style="text-align:right"><span data-en>Overall</span><span data-ko>종합</span></th>
        <th><span data-en>Review window</span><span data-ko>리뷰 열람</span></th>
        <th style="width:110px"></th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
  </div>
</main>

<footer class="foot"><div class="wrap foot-in">
  <small class="muted">© SMEAG MockTest · Student results</small>
</div></footer>

<script src="assets/app.js"></script>
<script src="assets/sg-auth.js"></script>
<script src="assets/sg-band.js"></script>
<script src="assets/sg-results.js"></script>
<script>
/* 선생님·관리자용 전체 응시 목록. 한 줄이 한 응시이고, 리뷰 버튼이 그 응시의
 * 문항별 채점(review.html)으로 간다.
 *
 * 권한의 정본은 Supabase RLS(sg_can_see) 다 — 학생이 이 주소를 직접 열어도, 선생님이
 * 남의 반을 보려 해도, 서버가 행을 돌려주지 않는다. 아래 role 확인은 안내 문구용이다.
 *
 * 그래서 이 표의 길이는 보는 사람마다 다르다. 선생님에게는 자기 학생만, 관리자에게는
 * 전부. 담당 선생님 열은 관리자에게만 뜬다 — 선생님 화면에서는 전부 자기 이름이라
 * 한 칸이 통째로 같은 값을 반복하게 된다. */
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var LAB = { reading: 'Reading', listening: 'Listening', writing: 'Writing', speaking: 'Speaking' };
  var ALL = [];
  var ROLE = '';
  var TEACHERS = {};                 // uuid → 이름. 관리자일 때만 채운다.

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function bi(en, ko) { return '<span data-en>' + esc(en) + '</span><span data-ko>' + esc(ko) + '</span>'; }
  function notice(en, ko) { $('notice').innerHTML = '<p>' + bi(en, ko) + '</p>'; $('notice').classList.remove('hide'); }
  function when(iso) {
    var d = iso ? new Date(iso) : null;
    if (!d || isNaN(d)) return '—';
    function p(n) { return (n < 10 ? '0' : '') + n; }
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function nameOf(r) { return (r.student && (r.student.name || r.student.email)) || '—'; }
  function idOf(r) { return (r.student && r.student.student_id) || ''; }
  function teacherOf(r) {
    var t = r.student && r.student.teacher_id;
    return (t && TEACHERS[t]) || (t ? '—' : '');
  }

  /* session → W·S 채점 행. load() 가 한 번만 읽어 채운다. */
  var TASKS = {};
  function viewOf(r) { return SG_BAND.of(r, TASKS[r.session] || []); }

  function chips(r) {
    var v = viewOf(r);
    return Object.keys(LAB).map(function (s) {
      var sec = v.sections[s];
      var band = sec && sec.band !== null ? SG_BAND.fmt(sec.band) : '—';
      // ✎ = AI 초안(교사 확정 전). 선생님이 손볼 곳을 한눈에 찾는 표시다.
      return '<span class="chip">' + LAB[s] + ' ' + band + (sec && sec.status === 'draft' ? ' ✎' : '') + '</span>';
    }).join(' ');
  }

  function shown() {
    var q = ($('q').value || '').trim().toLowerCase();
    var set = $('set').value;
    return ALL.filter(function (r) {
      if (set && r.set_code !== set) return false;
      if (!q) return true;
      return (nameOf(r) + ' ' + idOf(r)).toLowerCase().indexOf(q) >= 0;
    });
  }

  function paint() {
    var list = shown();
    var waiting = list.filter(function (r) { return viewOf(r).draft; }).length;
    $('count').textContent = list.length + ' / ' + ALL.length +
      (waiting ? '  ·  ✎ ' + waiting + ' awaiting confirmation' : '');
    $('rows').innerHTML = list.length ? list.map(function (r) {
      return '<tr>' +
        '<td ' + SG_LABEL('Date', '날짜') + '>' + when(r.submitted_at) + '</td>' +
        '<td class="card-title"><b>' + esc(nameOf(r)) + '</b>' +
          (idOf(r) ? '<div class="muted" style="font-size:12px">' + esc(idOf(r)) + '</div>' : '') + '</td>' +
        (ROLE === 'admin'
          ? '<td class="col-teacher" ' + SG_LABEL('Teacher', '담당 선생님') + '>' + esc(teacherOf(r) || '—') + '</td>'
          : '') +
        '<td ' + SG_LABEL('Test', '시험') + '><span class="chip">' + esc(r.set_code || '—') + '</span></td>' +
        '<td ' + SG_LABEL('Sections', '영역') + '><span class="chips" style="margin:0">' + chips(r) + '</span></td>' +
        '<td class="score" ' + SG_LABEL('Overall', '종합') + '>' +
          (viewOf(r).overall === null ? '—' : 'Band ' + SG_BAND.fmt(viewOf(r).overall)) + '</td>' +
        '<td ' + SG_LABEL('Review window', '리뷰 열람') + '>' + windowCell(r) + '</td>' +
        '<td class="card-actions"><a class="btn ghost sm" href="review.html?session=' + encodeURIComponent(r.session) +
          '&owner=' + encodeURIComponent(r.owner) + '">' + bi('Review', '리뷰') + '</a></td>' +
      '</tr>';
    }).join('') : '<tr><td colspan="' + (ROLE === 'admin' ? 8 : 7) + '" class="muted" style="padding:24px;text-align:center">' +
      bi('No results match.', '해당하는 응시가 없습니다.') + '</td></tr>';

    wireWindowButtons();
  }

  /* ── 리뷰 열람 창 ─────────────────────────────────────────────────────
     학생이 문항과 정답을 볼 수 있는 기간은 응시일(교사 리뷰가 있으면 그날) + 7일이다.
     지나면 서버가 문항을 내려주지 않는다 — 감추는 게 아니라 주지 않는다.
     여기서 관리자가 한 건씩 7일 다시 열어 줄 수 있다.

     날짜 계산은 이 화면이 하지 않는다. sg_review_windows() 가 서버에서 한 벌로
     계산해 준다 — 화면과 서버가 다른 날짜를 말하면 그 자체가 버그이기 때문이다. */
  var WIN = {};                                  // session|owner → { open, until, granted_until }
  var GRANT_DAYS = 7;
  function winKey(r) { return r.session + '|' + r.owner; }

  function loadWindows() {
    var list = ALL.map(function (r) { return r.session; });
    if (!list.length) return Promise.resolve();
    return SG_AUTH.token().then(function (tok) {
      if (!tok) return;
      return fetch(SG_AUTH.url + '/rest/v1/rpc/sg_review_windows', {
        method: 'POST',
        headers: { apikey: SG_AUTH.anonKey, Authorization: 'Bearer ' + tok, 'Content-Type': 'application/json' },
        body: JSON.stringify({ p_sessions: list })
      }).then(function (res) { return res.ok ? res.json() : []; }).then(function (rows) {
        WIN = {};
        (rows || []).forEach(function (w) { WIN[w.session + '|' + w.owner] = w; });
      });
    }).catch(function () {});
  }

  function windowCell(r) {
    var w = WIN[winKey(r)];
    if (!w) return '<span class="muted">—</span>';
    var label = w.granted_until
      ? '<span class="chip">' + bi('reopened', '재개방') + ' · ' + when(w.granted_until) + '</span>'
      : w.open ? '<span class="chip">' + bi('open to ', '~ ') + when(w.until) + '</span>'
               : '<span class="chip">' + bi('closed ', '닫힘 ') + when(w.until) + '</span>';
    /* 여는 것은 관리자뿐이다. 선생님 화면에서는 상태만 보인다(RLS 도 같은 말을 한다). */
    if (ROLE !== 'admin') return label;
    var btn = w.granted_until
      ? '<button class="btn ghost sm" data-revoke="' + esc(winKey(r)) + '">' + bi('Close now', '지금 닫기') + '</button>'
      : '<button class="btn ghost sm" data-open="' + esc(winKey(r)) + '">' +
          bi('Open ' + GRANT_DAYS + ' days', GRANT_DAYS + '일 열기') + '</button>';
    return label + ' ' + btn;
  }

  function rowOfKey(key) {
    for (var i = 0; i < ALL.length; i++) if (winKey(ALL[i]) === key) return ALL[i];
    return null;
  }

  function grant(r, on) {
    return SG_AUTH.token().then(function (tok) {
      if (!tok) throw new Error('signed out');
      var head = { apikey: SG_AUTH.anonKey, Authorization: 'Bearer ' + tok, 'Content-Type': 'application/json' };
      if (!on) {
        /* 회수는 기록을 지운다 — 만료된 해제를 남겨 둘 이유가 없다. */
        return fetch(SG_AUTH.url + '/rest/v1/sg_review_grants?session=eq.' +
                     encodeURIComponent(r.session) + '&owner=eq.' + encodeURIComponent(r.owner),
                     { method: 'DELETE', headers: head });
      }
      var until = new Date(Date.now() + GRANT_DAYS * 86400000).toISOString();
      return fetch(SG_AUTH.url + '/rest/v1/sg_review_grants', {
        method: 'POST', headers: head,
        body: JSON.stringify({ owner: r.owner, session: r.session,
                               granted_by: (SG_AUTH.user() || {}).id, expires_at: until,
                               note: 'admin-results' })
      });
    }).then(function (res) {
      if (res && !res.ok && res.status === 403) {
        notice('Only an administrator can open a closed review.', '닫힌 리뷰는 관리자만 열 수 있습니다.');
      }
      return loadWindows().then(paint);
    });
  }

  function wireWindowButtons() {
    Array.prototype.forEach.call($('rows').querySelectorAll('[data-open],[data-revoke]'), function (b) {
      b.onclick = function () {
        var on = b.hasAttribute('data-open');
        var r = rowOfKey(b.getAttribute(on ? 'data-open' : 'data-revoke'));
        if (!r) return;
        b.disabled = true;
        grant(r, on).catch(function () { b.disabled = false; });
      };
    });
  }

  function fillSets() {
    var seen = {}, opts = '<option value="">' + 'All sets' + '</option>';
    ALL.forEach(function (r) {
      if (!r.set_code || seen[r.set_code]) return;
      seen[r.set_code] = true;
      opts += '<option value="' + esc(r.set_code) + '">' + esc(r.set_code) + '</option>';
    });
    $('set').innerHTML = opts;
  }

  function csv() {
    /* 밴드를 앞에 두고 원점수를 뒤에 둔다 — 성적표의 눈금이 밴드이기 때문이다.
       확정 전(AI 초안)이면 band_status 가 draft 다. 그 열이 없으면 스프레드시트에서
       초안과 확정 점수가 구분 없이 섞인다. */
    var head = ['submitted_at', 'name', 'student_id', 'teacher', 'set',
                'band_overall', 'band_reading', 'band_listening', 'band_writing', 'band_speaking',
                'band_status', 'cefr', 'auto_correct', 'auto_total', 'session'];
    var lines = [head.join(',')];
    shown().forEach(function (r) {
      var v = viewOf(r);
      function b(s) { return v.sections[s].band === null ? '' : SG_BAND.fmt(v.sections[s].band); }
      lines.push([r.submitted_at || '', nameOf(r), idOf(r), teacherOf(r), r.set_code || '',
                  v.overall === null ? '' : SG_BAND.fmt(v.overall),
                  b('reading'), b('listening'), b('writing'), b('speaking'),
                  v.draft ? 'draft' : (v.pending.length ? 'incomplete' : 'final'),
                  v.cefr, r.score, r.total, r.session]
        .map(function (v2) { return '"' + String(v2).replace(/"/g, '""') + '"'; }).join(','));
    });
    var blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'studyground-results.csv';
    a.click();
  }

  function load() {
    /* 응시 목록과 W·S 채점을 각각 한 번씩만 읽는다. 채점 조회가 실패해도 목록은
       그린다 — 그때는 W·S 가 '아직 채점 전' 으로 보이고 리뷰에서 확인하면 된다. */
    Promise.all([
      SG_RESULTS.listAll(),
      SG_RESULTS.tasks().catch(function () { return []; })
    ]).then(function (out) {
      var rows = out[0];
      TASKS = SG_RESULTS.tasksBySession(out[1]);
      ALL = rows || [];
      if (!ALL.length) {
        notice('No submitted test has been uploaded yet.', '아직 올라온 응시 결과가 없습니다.');
        return;
      }
      fillSets();
      $('filters').classList.remove('hide');
      $('table-card').classList.remove('hide');
      paint();
      $('q').oninput = paint;
      $('set').onchange = paint;
      /* 열람 창은 뒤늦게 와도 된다 — 먼저 목록을 보여 주고 그 위에 덧그린다. */
      loadWindows().then(paint);
    }).catch(function () {
      notice('Could not load results.', '결과를 불러오지 못했습니다.');
    });
  }

  /* 담당 선생님 이름표. 관리자 토큰이라야 다른 사람 프로필이 읽힌다 — 선생님은
     이 질의를 부르지도 않는다(자기 학생만 보이므로 열 자체가 없다). */
  function teacherNames() {
    return SG_AUTH.token().then(function (tok) {
      if (!tok) return;
      return fetch(SG_AUTH.url + '/rest/v1/sg_profiles?role=eq.teacher&select=id,name', {
        headers: { apikey: SG_AUTH.anonKey, Authorization: 'Bearer ' + tok }
      }).then(function (r) { return r.ok ? r.json() : []; }).then(function (rows) {
        (rows || []).forEach(function (t) { TEACHERS[t.id] = t.name || ''; });
      });
    }).catch(function () {});
  }

  function boot() {
    $('csv').onclick = csv;
    if (!window.SG_AUTH || !SG_AUTH.user()) {
      SG_AUTH.require();
      return;
    }
    SG_AUTH.role().then(function (role) {
      ROLE = role;
      $('who').textContent = role;
      if (role !== 'teacher' && role !== 'admin') {
        notice('This page is for teachers and administrators.', '이 화면은 선생님·관리자 전용입니다.');
        return;
      }
      if (role === 'teacher') {
        notice('You see the students assigned to you. Ask an administrator to change an assignment.',
               '배정된 담당 학생만 보입니다. 담당 변경은 관리자에게 요청하세요.');
        load();
        return;
      }
      // 관리자만 담당 선생님 열을 얻는다. 이름을 못 읽어도 목록은 그대로 뜬다.
      Array.prototype.forEach.call(document.querySelectorAll('.col-teacher'), function (el) {
        el.classList.remove('hide');
      });
      teacherNames().then(load, load);
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
